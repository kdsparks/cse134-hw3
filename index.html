<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cadie on the Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="eventual.css">
    <noscript>Whoops your JavaScript is off! But no worries, this site works on just HTML.</noscript>
    <style>
        body {border: 2px dotted rgb(115, 155, 164);}
    </style>
    <script>
        window.addEventListener('load', function() {
            let canvas = document.getElementById('canvas');
            let context = canvas.getContext('2d');
            context.fillStyle = 'green';
            context.fillRect(10, 30, 20, 40);
        })
    </script>
    <script>
        class HelloWorld extends HTMLElement {
            connectedCallback() {
                console.log("Hello World!");
            }
        }
        customElements.define("hello-world", HelloWorld);
    </script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>

                <li><a href="making.html">Making</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Cadie Sparks</h1>
        <h2>Welcome to my site</h2>
        <h3>Behold:</h3>
        <canvas id="canvas" width="100" height="100">
            <strong>Canvas Supporting Browser Required</strong>
        </canvas>
        <figure>
            <svg width="200" height="300">
                <polygon points="30,50 70,140 130,140 160,40" fill="orange"></polygon>
            </svg>
            <figcaption>Figure: Tom's Shapes</figcaption>
        </figure>
        <hello-world></hello-world>
    </main>
    <footer>
        <address>
            <a href="mailto:cadiesparks@gmail.com">cadiesparks@gmail.com</a>
